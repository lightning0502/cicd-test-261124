name: PUSH 기반 CI/CD 테스트

# event trigger 할당 (CI/CD가 작동하게 되는 원인) + main 브런치에서 push하면 트리거 발동
on:
    push:
        branches:
            - main

# 파이프라인
jobs:
    # CI name 선언, 머신 및 OS 등이 필요 -> 지금은 Github Action(무료)를 사용
    cicd:
    # CI
        # OS 지정
        runs-on: ubuntu-latest

        # details
        steps:
            - name: 코드 checkout # 소스코드 pull
              uses: actions/checkout@v5 # 라이브러리

            - name: 코드 확인/검증
              run: | # " | " == 여러가지의 리눅스 명령어 사용
                pwd
                ls -al
                cat main.py
              shell: bash

        # 지속적 통합 + build or unit test 수행 및 etc..

    # CD 작업



