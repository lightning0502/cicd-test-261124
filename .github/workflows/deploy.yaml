name: PUSH 기반 CI/CD 테스트

# event trigger 할당 (CI/CD가 작동하게 되는 원인) + main 브런치에서 push하면 트리거 발동
on:
  push:
    branches: ["refactor"] # n개의 브랜치 제어

# 파이프라인
jobs:
  # CI name 선언, 머신 및 OS 등이 필요 -> 지금은 Github Action(무료)를 사용
  ci:
    # OS 지정
    runs-on: ubuntu-latest

    # details
    steps:
      # 소스코드 pull
      - name: code checkout
        uses: actions/checkout@v5 # 라이브러리

      # 도커허브 로그인 -> 이미지 push
      - name: docker-hub login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # fastAPI app image build & push
      - name: build & push fastAPI
        uses: docker/build-push-action@v4
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USER_NAME }}/fastapi-app:1.0

      # nginx proxy image build & push
      - name: build & push nginx proxy
        uses: docker/build-push-action@v4
        with:
          context: ./nginx
          file: ./nginx/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USER_NAME }}/nginx-proxy:1.0


  cd:
    # CI 작업 이후 CD로 순서(defendency) 보장
    needs: ci

    # OS 지정
    runs-on: ubuntu-latest

    steps:
      # 소스코드 pull
      - name: code checkout
        uses: actions/checkout@v5 # 라이브러리

      # docker-compose.yaml 파일만 EC2 서버에 복사
      - name: copy docker-compose.yaml to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          source: ./docker-compose.yaml
          target: "/home/ubuntu"
      
      # EC2 서버에서 컨테이너 교체
      - name: script run and container setting
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_IP }}
          username: ${{ secrets.USER_NAME }}
          key: ${{ secrets.EC2_KEY }}
          port: 22

          script: |
            # 작업 디렉토리 이동 (yaml 파일 위치)
            cd /home/ubuntu

            # 컨테이너 구성 (.env를 생성해서 주입 가능) + image는 CI서버에서 했으므로 --build 필요 없음
            docker compose up -d

            docker image prune -f



